name: Build iOS IPA (Physical iPhone ARM64)

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Setup Environment Variables (.env)
        env:
          EXPO_ENV_FILE: ${{ secrets.EXPO_ENV_FILE }}
        run: |
          if [ -n "$EXPO_ENV_FILE" ]; then
            echo "$EXPO_ENV_FILE" > .env
            echo "Loaded .env from GitHub Secrets."
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "Copied .env.example as fallback .env."
          fi

      - name: 4. Install Dependencies
        run: npm install

      - name: 5. Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 6. Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: 7. Build Native ARM64 Archive (Physical iPhone Device)
        run: |
          xcodebuild \
            -workspace ios/ToolKit.xcworkspace \
            -scheme ToolKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ToolKit.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 8. Package ToolKit-arm64.ipa (ZIP Container)
        run: |
          mkdir -p Payload
          cp -r build/ToolKit.xcarchive/Products/Applications/ToolKit.app Payload/
          zip -r ToolKit-arm64.ipa Payload/
          echo "IPA packaging completed. Size:"
          ls -lh ToolKit-arm64.ipa

      - name: 9. Upload ToolKit-arm64.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolKit-arm64-ipa
          path: ToolKit-arm64.ipa
          retention-days: 14
