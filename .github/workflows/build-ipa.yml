name: Build iOS IPA (Physical iPhone ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Select Latest Xcode (Xcode 26.3 for Swift 6.3)
        run: |
          echo "=== All Available Xcode Versions in /Applications ==="
          ls -ld /Applications/Xcode*.app || true
          for app in /Applications/Xcode_26.3*.app /Applications/Xcode_26.2*.app /Applications/Xcode_26*.app /Applications/Xcode_16.4*.app /Applications/Xcode_16*.app /Applications/Xcode.app; do
            if [ -d "$app" ]; then
              echo "Selecting Xcode from $app"
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          echo "=== Active Xcode & Swift Toolchain ==="
          xcodebuild -version
          swift --version

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Setup Environment Variables (.env)
        env:
          EXPO_ENV_FILE: ${{ secrets.EXPO_ENV_FILE }}
        run: |
          if [ -n "$EXPO_ENV_FILE" ]; then
            echo "$EXPO_ENV_FILE" > .env
            echo "Loaded .env from GitHub Secrets."
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "Copied .env.example as fallback .env."
          fi

      - name: 5. Install Dependencies
        run: npm install

      - name: 6. Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 6.1. Strip APNs Entitlements for Free Apple ID / Sideload Compatibility
        run: |
          echo "=== Scanning and removing aps-environment entitlement ==="
          find ios -name "*.entitlements" | while read -r ent; do
            echo "Checking entitlements: $ent"
            if /usr/libexec/PlistBuddy -c "Print :aps-environment" "$ent" 2>/dev/null; then
              echo "Removing aps-environment from $ent..."
              /usr/libexec/PlistBuddy -c "Delete :aps-environment" "$ent" || true
            fi
          done
          echo "=== Scanning Info.plist for remote-notification background mode ==="
          find ios -name "Info.plist" | while read -r plist; do
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$plist" 2>/dev/null || true
          done

      - name: 7. Apply Expo Modules Swift Patches
        run: node scripts/patch-expo-modules-jsi.js

      - name: 8. Install CocoaPods Dependencies
        run: |
          cd ios
          pod install

      - name: 9. Build Native ARM64 Archive (Physical iPhone Device)
        run: |
          xcodebuild \
            -workspace ios/ToolKit.xcworkspace \
            -scheme ToolKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ToolKit.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_STRICT_CONCURRENCY=minimal

      - name: 10. Package & Ad-Hoc Sign ToolKit-arm64.ipa
        run: |
          rm -rf Payload ToolKit-arm64.ipa
          mkdir -p Payload
          APP_DIR="build/ToolKit.xcarchive/Products/Applications/ToolKit.app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          fi
          if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
            echo "::error::Application bundle (.app) not found in build directory!"
            exit 1
          fi

          echo "Packaging from: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          TARGET_APP="Payload/ToolKit.app"

          # Remove stale/invalid provisioning profiles if present
          rm -f "$TARGET_APP/embedded.mobileprovision"

          echo "=== Ad-hoc signing embedded frameworks ==="
          if [ -d "$TARGET_APP/Frameworks" ]; then
            for fw in "$TARGET_APP/Frameworks/"*.framework; do
              if [ -d "$fw" ]; then
                echo "Signing framework: $(basename "$fw")"
                codesign --force --sign - --timestamp=none "$fw" || true
              fi
            done
            for dylib in "$TARGET_APP/Frameworks/"*.dylib; do
              if [ -f "$dylib" ]; then
                echo "Signing dylib: $(basename "$dylib")"
                codesign --force --sign - --timestamp=none "$dylib" || true
              fi
            done
          fi

          echo "=== Ad-hoc signing main executable and bundle ==="
          codesign --force --sign - --timestamp=none "$TARGET_APP" || true

          echo "=== Verifying signature of main bundle ==="
          codesign -dvvv "$TARGET_APP" 2>&1 | head -n 20 || true

          zip -r ToolKit-arm64.ipa Payload/
          echo "IPA packaging completed. Size:"
          ls -lh ToolKit-arm64.ipa

      - name: 11. Upload ToolKit-arm64.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolKit-arm64-ipa
          path: ToolKit-arm64.ipa
          retention-days: 14
