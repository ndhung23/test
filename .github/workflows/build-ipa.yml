name: Build iOS IPA (Physical iPhone ARM64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Select Latest Xcode
        run: |
          for app in /Applications/Xcode.app /Applications/Xcode_16.4*.app /Applications/Xcode_16*.app; do
            if [ -d "$app" ]; then
              echo "Selecting Xcode from $app"
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: 3. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 4. Setup Environment Variables (.env)
        env:
          EXPO_ENV_FILE: ${{ secrets.EXPO_ENV_FILE }}
        run: |
          if [ -n "$EXPO_ENV_FILE" ]; then
            echo "$EXPO_ENV_FILE" > .env
            echo "Loaded .env from GitHub Secrets."
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo "Copied .env.example as fallback .env."
          fi

      - name: 5. Install Dependencies
        run: npm install

      - name: 6. Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 7. Apply Expo Modules Swift Patches
        run: node scripts/patch-expo-modules-jsi.js

      - name: 8. Install CocoaPods Dependencies
        run: |
          cd ios
          pod install

      - name: 9. Build Native ARM64 Archive (Physical iPhone Device)
        run: |
          xcodebuild \
            -workspace ios/ToolKit.xcworkspace \
            -scheme ToolKit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ToolKit.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: 10. Package ToolKit-arm64.ipa (ZIP Container)
        run: |
          mkdir -p Payload
          APP_DIR="build/ToolKit.xcarchive/Products/Applications/ToolKit.app"
          if [ ! -d "$APP_DIR" ]; then
            APP_DIR=$(find build -name "*.app" -type d | head -n 1)
          fi
          echo "Packaging from: $APP_DIR"
          cp -r "$APP_DIR" Payload/
          zip -r ToolKit-arm64.ipa Payload/
          echo "IPA packaging completed. Size:"
          ls -lh ToolKit-arm64.ipa

      - name: 11. Upload ToolKit-arm64.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToolKit-arm64-ipa
          path: ToolKit-arm64.ipa
          retention-days: 14
